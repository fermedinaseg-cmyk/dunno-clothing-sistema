name: Publicar sitio
# Publica la carpeta web/ en GitHub Pages cada vez que cambia la rama main.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Cada publicación lleva un número de versión distinto en los archivos, para que los navegadores
      # no sigan mostrando la versión anterior guardada en caché.
      - name: Poner número de versión
        run: grep -rl '__V__' web | xargs sed -i "s/__V__/${GITHUB_SHA::10}/g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
